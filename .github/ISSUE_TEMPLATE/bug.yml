name: バグの報告
description: 期待どおりに動かないことを報告する。脆弱性は、ここに書かず SECURITY.md の窓口へ
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: ブラウザ、OS、発生した日時など
  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 脆弱性ではない
          required: true
